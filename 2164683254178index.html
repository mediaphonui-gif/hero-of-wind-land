<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

function resize(){

    canvas.width=window.innerWidth;

    canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);





//=========================
// INPUT
//=========================

const Keys={};

window.addEventListener("keydown",e=>{

    Keys[e.key.toLowerCase()]=true;

});

window.addEventListener("keyup",e=>{

    Keys[e.key.toLowerCase()]=false;

});



//=========================
// CAMERA
//=========================

const Camera={

    x:0,

    y:0,

    width:0,

    height:0,

    update(){

        this.width=canvas.width;

        this.height=canvas.height;

    }

};



//=========================
// WORLD
//=========================

const World={

    tileSize:32,

    width:300,

    height:300,

    draw(){

        const startX=Math.floor(Camera.x/this.tileSize);

        const startY=Math.floor(Camera.y/this.tileSize);

        const endX=startX+Math.ceil(Camera.width/this.tileSize)+2;

        const endY=startY+Math.ceil(Camera.height/this.tileSize)+2;

        for(let y=startY;y<endY;y++){

            for(let x=startX;x<endX;x++){

                if(x<0||y<0)continue;

                if(x>=this.width||y>=this.height)continue;

                ctx.fillStyle=((x+y)%2==0)
                ?"#63bf63"
                :"#5db55d";

                ctx.fillRect(

                    x*this.tileSize-Camera.x,

                    y*this.tileSize-Camera.y,

                    this.tileSize,

                    this.tileSize

                );

            }

        }

    }

};



//=========================
// PLAYER
//=========================

const Player={

    x:200,

    y:200,

    width:32,

    height:32,

    speed:240,

    dir:"down",

    moving:false,

    hp:100,

    mana:100,

    level:1,

    exp:0,

    update(dt){

        this.moving=false;

        if(Keys["w"]){

            this.y-=this.speed*dt;

            this.dir="up";

            this.moving=true;

        }

        if(Keys["s"]){

            this.y+=this.speed*dt;

            this.dir="down";

            this.moving=true;

        }

        if(Keys["a"]){

            this.x-=this.speed*dt;

            this.dir="left";

            this.moving=true;

        }

        if(Keys["d"]){

            this.x+=this.speed*dt;

            this.dir="right";

            this.moving=true;

        }

    },

    draw(){

        const px=this.x-Camera.x;

        const py=this.y-Camera.y;

        ctx.fillStyle="#2979ff";

        ctx.fillRect(

            px,

            py,

            this.width,

            this.height

        );

        ctx.fillStyle="white";

        if(this.dir=="down"){

            ctx.fillRect(px+10,py+22,12,4);

        }

        if(this.dir=="up"){

            ctx.fillRect(px+10,py+6,12,4);

        }

        if(this.dir=="left"){

            ctx.fillRect(px+4,py+10,4,12);

        }

        if(this.dir=="right"){

            ctx.fillRect(px+24,py+10,4,12);

        }

    }

};



//=========================
// CAMERA FOLLOW
//=========================

function updateCamera(){

    Camera.update();

    Camera.x=Player.x-canvas.width/2+16;

    Camera.y=Player.y-canvas.height/2+16;

    const maxX=World.width*World.tileSize-canvas.width;

    const maxY=World.height*World.tileSize-canvas.height;

    if(Camera.x<0)Camera.x=0;
    if(Camera.y<0)Camera.y=0;

    if(Camera.x>maxX)Camera.x=maxX;
    if(Camera.y>maxY)Camera.y=maxY;

}
//=========================
// COLLISION MAP
//=========================

const Collision={

    data:[],

    init(){

        for(let y=0;y<World.height;y++){

            this.data[y]=[];

            for(let x=0;x<World.width;x++){

                this.data[y][x]=0;

            }

        }

        // Viền bản đồ

        for(let x=0;x<World.width;x++){

            this.data[0][x]=1;
            this.data[World.height-1][x]=1;

        }

        for(let y=0;y<World.height;y++){

            this.data[y][0]=1;
            this.data[y][World.width-1]=1;

        }

        // Rừng

        for(let x=15;x<45;x++){

            this.data[18][x]=1;

        }

        for(let y=22;y<40;y++){

            this.data[y][28]=1;

        }

        // Hồ

        for(let y=60;y<72;y++){

            for(let x=70;x<90;x++){

                this.data[y][x]=1;

            }

        }

    },

    blocked(px,py){

        const tx=Math.floor(px/World.tileSize);

        const ty=Math.floor(py/World.tileSize);

        if(tx<0)return true;
        if(ty<0)return true;

        if(tx>=World.width)return true;
        if(ty>=World.height)return true;

        return this.data[ty][tx]==1;

    },

    draw(){

        for(let y=0;y<World.height;y++){

            for(let x=0;x<World.width;x++){

                if(this.data[y][x]==0)continue;

                ctx.fillStyle="#4b4b4b";

                ctx.fillRect(

                    x*32-Camera.x,

                    y*32-Camera.y,

                    32,

                    32

                );

            }

        }

    }

};

Collision.init();



//=========================
// ENTITY
//=========================

class Entity{

    constructor(x,y,w,h){

        this.x=x;
        this.y=y;

        this.width=w;
        this.height=h;

        this.dead=false;

    }

}





//=========================
// NPC
//=========================

class NPC extends Entity{

    constructor(x,y,name,text){

        super(x,y,32,32);

        this.name=name;

        this.text=text;

        this.distance=9999;

    }

    update(){

        const dx=Player.x-this.x;

        const dy=Player.y-this.y;

        this.distance=Math.sqrt(dx*dx+dy*dy);

    }

    draw(){

        ctx.fillStyle="#ffcf4d";

        ctx.fillRect(

            this.x-Camera.x,

            this.y-Camera.y,

            32,

            32

        );

        if(this.distance<80){

            ctx.fillStyle="white";

            ctx.font="18px Arial";

            ctx.fillText(

                "E",

                this.x-Camera.x+10,

                this.y-Camera.y-8

            );

        }

    }

}

//=========================
// PLAYER COLLISION
//=========================

Player.move=function(dx,dy){

    const nx=this.x+dx;

    const ny=this.y+dy;

    if(!Collision.blocked(nx,this.y))
        this.x=nx;

    if(!Collision.blocked(this.x,ny))
        this.y=ny;

};

Player.update=function(dt){

    this.moving=false;

    if(Keys["w"]){

        this.move(0,-this.speed*dt);

        this.dir="up";

        this.moving=true;

    }

    if(Keys["s"]){

        this.move(0,this.speed*dt);

        this.dir="down";

        this.moving=true;

    }

    if(Keys["a"]){

        this.move(-this.speed*dt,0);

        this.dir="left";

        this.moving=true;

    }

    if(Keys["d"]){

        this.move(this.speed*dt,0);

        this.dir="right";

        this.moving=true;

    }

};
//=========================
// ENEMY ENGINE
//=========================

class Enemy extends Entity{

    constructor(x,y,type){

        super(x,y,32,32);

        this.type=type;

        this.maxHp=40;
        this.hp=40;

        this.attack=5;

        this.speed=70;

        this.range=220;

        this.attackRange=34;

        this.cooldown=0;

        this.state="idle";

        this.exp=8;

        this.gold=5;

    }

    update(dt){

        if(this.dead)return;

        const dx=Player.x-this.x;
        const dy=Player.y-this.y;

        const distance=Math.sqrt(dx*dx+dy*dy);

        if(distance<this.range){

            this.state="chase";

            const angle=Math.atan2(dy,dx);

            const vx=Math.cos(angle)*this.speed*dt;

            const vy=Math.sin(angle)*this.speed*dt;

            if(!Collision.blocked(this.x+vx,this.y))
                this.x+=vx;

            if(!Collision.blocked(this.x,this.y+vy))
                this.y+=vy;

        }else{

            this.state="idle";

        }

        if(this.cooldown>0)
            this.cooldown-=dt;

        if(distance<this.attackRange){

            if(this.cooldown<=0){

                Player.hp-=this.attack;

                if(Player.hp<0)
                    Player.hp=0;

                this.cooldown=1;

            }

        }

    }

    draw(){

        if(this.dead)return;

        const sx=this.x-Camera.x;
        const sy=this.y-Camera.y;

        ctx.fillStyle="#cc4444";

        ctx.fillRect(

            sx,

            sy,

            32,

            32

        );

        // HP BAR

        ctx.fillStyle="black";

        ctx.fillRect(

            sx,

            sy-10,

            32,

            5

        );

        ctx.fillStyle="lime";

        ctx.fillRect(

            sx,

            sy-10,

            32*(this.hp/this.maxHp),

            5

        );

    }

}

//=========================

//=========================

const Attack={

    active:false,

    x:0,

    y:0,

    width:36,

    height:36,

    timer:0,

    damage:15,

    start(){

        this.active=true;

        this.timer=.18;

        switch(Player.dir){

            case"up":

                this.x=Player.x;
                this.y=Player.y-32;

            break;

            case"down":

                this.x=Player.x;
                this.y=Player.y+32;

            break;

            case"left":

                this.x=Player.x-32;
                this.y=Player.y;

            break;

            case"right":

                this.x=Player.x+32;
                this.y=Player.y;

            break;

        }

    },

    update(dt){

        if(!this.active)return;

        this.timer-=dt;

        if(this.timer<=0){

            this.active=false;

        }

    },

    draw(){

        if(!this.active)return;

        ctx.strokeStyle="yellow";

        ctx.lineWidth=2;

        ctx.strokeRect(

            this.x-Camera.x,

            this.y-Camera.y,

            this.width,

            this.height

        );

    }

};

window.addEventListener("keydown",e=>{

    if(e.code=="Space"){

        if(!Attack.active)
            Attack.start();

    }

});



//=========================
// HIT DETECTION
//=========================

function hitEnemy(){

    if(!Attack.active)return;

    for(const enemy of Enemies){

        if(enemy.dead)continue;

        if(

            Attack.x<enemy.x+enemy.width&&

            Attack.x+Attack.width>enemy.x&&

            Attack.y<enemy.y+enemy.height&&

            Attack.y+Attack.height>enemy.y

        ){

            enemy.hp-=Attack.damage;

            if(enemy.hp<=0){

                enemy.dead=true;

                Player.exp+=enemy.exp;

            }

        }

    }

}



//=========================
// GOLD
//=========================

Player.gold=0;

function collectReward(){

    for(const enemy of Enemies){

        if(enemy.dead&&!enemy.reward){

            enemy.reward=true;

            Player.gold+=enemy.gold;

        }

    }

}
//=========================
// PLAYER LEVEL SYSTEM
//=========================

Player.maxHp=100;

Player.maxMana=100;

Player.nextExp=50;

Player.levelPoint=0;

Player.str=5;

Player.agi=5;

Player.int=5;

Player.def=5;

Player.attack=15;

Player.critical=5;

Player.attackSpeed=1;

Player.levelUp=function(){

    while(this.exp>=this.nextExp){

        this.exp-=this.nextExp;

        this.level++;

        this.levelPoint+=5;

        this.nextExp=Math.floor(this.nextExp*1.35);

        this.maxHp+=20;

        this.maxMana+=10;

        this.hp=this.maxHp;

        this.mana=this.maxMana;

        this.attack+=3;

    }

};



//=========================
// INVENTORY
//=========================

const Inventory={

    rows:6,

    cols:8,

    slots:[],

    open:false,

    init(){

        for(let i=0;i<this.rows*this.cols;i++){

            this.slots.push(null);

        }

    },

    add(item){

        for(let i=0;i<this.slots.length;i++){

            if(this.slots[i]==null){

                this.slots[i]=item;

                return true;

            }

        }

        return false;

    },

    draw(){

        if(!this.open)return;

        const w=560;

        const h=420;

        const sx=canvas.width/2-w/2;

        const sy=canvas.height/2-h/2;

        ctx.fillStyle="rgba(0,0,0,.88)";

        ctx.fillRect(sx,sy,w,h);

        ctx.strokeStyle="white";

        ctx.strokeRect(sx,sy,w,h);

        ctx.fillStyle="white";

        ctx.font="22px Arial";

        ctx.fillText("Inventory",sx+20,sy+35);

        let index=0;

        for(let y=0;y<this.rows;y++){

            for(let x=0;x<this.cols;x++){

                const px=sx+20+x*64;

                const py=sy+60+y*58;

                ctx.strokeStyle="#888";

                ctx.strokeRect(px,py,48,48);

                const item=this.slots[index];

                if(item){

                    ctx.fillStyle=item.color;

                    ctx.fillRect(px+6,py+6,36,36);

                    ctx.fillStyle="white";

                    ctx.font="10px Arial";

                    ctx.fillText(item.name,px,py+62);

                }

                index++;

            }

        }

    }

};

Inventory.init();

window.addEventListener("keydown",e=>{

function randomItem(){

    if(r<0.70)return structuredClone(ItemDB.axe);

    if(r<0.88)return structuredClone(ItemDB.bow);

    if(r<0.97)return structuredClone(ItemDB.armor);

    return structuredClone(ItemDB.wand);

}

function rewardDeadEnemy(){

    for(const e of Enemies){

        if(e.dead&&!e.dropDone){

            e.dropDone=true;

            if(Math.random()<0.65){

                Inventory.add(

                    randomItem()

                );

            }

        }

    }

}

const QuestManager={

    quests:[],

    active:null,

    completed:[],

    create(){

        this.quests.push({

            id:1,

            title:"Slime Trouble",

            description:"Defeat 10 Slimes",

            target:"Slime",

            need:10,

            progress:0,

            rewardGold:100,

            rewardExp:80,

            rewardItem:"sword"

        });

        this.quests.push({

            id:2,

            title:"Goblin Camp",

            description:"Defeat 8 Goblins",

            target:"Goblin",

            need:8,

            progress:0,

            rewardGold:180,

            rewardExp:150,

            rewardItem:"axe"

        });

        this.quests.push({

            id:3,

            title:"Wolf Hunter",

            description:"Defeat 15 Wolves",

            target:"Wolf",

            need:15,

            progress:0,

            rewardGold:250,

            rewardExp:300,

            rewardItem:"armor"

        });

    },

    accept(id){

        for(const q of this.quests){

            if(q.id==id){

                this.active=structuredClone(q);

                return;

            }

        }

    },

    enemyKilled(type){

        if(!this.active)return;

        if(this.active.target!=type)return;

        this.active.progress++;

        if(this.active.progress>=this.active.need){

            this.finish();

        }

    },

    finish(){

        Player.gold+=this.active.rewardGold;

        Player.exp+=this.active.rewardExp;

        Inventory.add(

            structuredClone(

                ItemDB[this.active.rewardItem]

            )

        );

        this.completed.push(this.active.id);

        this.active=null;

    },

    draw(){

        if(!this.active)return;

        ctx.fillStyle="rgba(0,0,0,.55)";

        ctx.fillRect(

            canvas.width-320,

            20,

            290,

            90

        );

        ctx.fillStyle="white";

        ctx.font="18px Arial";

        ctx.fillText(

            this.active.title,

            canvas.width-300,

            45

        );

        ctx.font="15px Arial";

        ctx.fillText(

            this.active.progress+

            " / "+

            this.active.need,

            canvas.width-300,

            75

        );

    }

};

//=========================
// PET UPDATE
//=========================

function updatePet(dt){

    if(!Player.pet)return;

    const pet=Player.pet;

    let dx=Player.x-45-pet.x;

    let dy=Player.y+45-pet.y;

    pet.x+=dx*4*dt;

    pet.y+=dy*4*dt;

    if(pet.cooldown>0)

        pet.cooldown-=dt;

    let target=null;

    let nearest=99999;

    for(const e of Enemies){

        if(e.dead)continue;

        const ex=e.x-pet.x;

        const ey=e.y-pet.y;

        const d=Math.sqrt(ex*ex+ey*ey);

        if(d<nearest){

            nearest=d;

            target=e;

        }

    }

    if(target){

        const dx2=target.x-pet.x;

        const dy2=target.y-pet.y;

        const dist=Math.sqrt(dx2*dx2+dy2*dy2);

        if(dist<220){

            pet.x+=Math.cos(Math.atan2(dy2,dx2))*pet.speed*dt;

            pet.y+=Math.sin(Math.atan2(dy2,dx2))*pet.speed*dt;

            if(dist<40){

                if(pet.cooldown<=0){

                    target.hp-=pet.damage;

                    pet.cooldown=.7;

                    if(target.hp<=0){

                        target.dead=true;

                        Player.exp+=target.exp;

                        Player.gold+=target.gold;

                        QuestManager.enemyKilled(target.type);

                    }

                }

            }

        }

    }

}

}

function randomRarity(){

    const r=Math.random()*100;

    let total=0;

    for(const k in Rarity){

        total+=Rarity[k].rate;

        if(r<=total){

            return structuredClone(

                Rarity[k]

            );

        }

    }

function generateEquipment(level){

    const names=[

        "Bow",
        "Staff",
        "Dagger",
        "Hammer",
        "Armor",
        "Helmet",
        "Ring",
        "Boots",

    ];

    const rarity=randomRarity();

    return{

        ),

        sell:Math.floor(

            level*15*rarity.bonus

        )

    };

}

function enhance(item){

    if(item.plus>=15)

        return;

    const rate=[

        100,
        95,
        90,
        85,
        80,
        75,
        70,
        60,
        50,
        45,
        35,
        28,
        20,
        12,
        6

    ];

    const success=

    Math.random()*100

    <=

    rate[item.plus];

    if(success){

        item.plus++;

        item.attack+=4;

        item.defense+=3;

    }else{

        if(item.plus>=10){

            item.plus--;

        }

    }

}

if(s.timer>0)return;

if(Player.mana<s.mana)return;

Player.mana-=s.mana;

s.timer=s.cooldown;

vy=-420;

case"down":

break;

vx=420;

);

const dx=enemy.x-Player.x;
